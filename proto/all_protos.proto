syntax = "proto3";
package freefire.omniproxy;

// ============================================================================
// 1. MajorLogin & Authentication (thunderFF.proto / RbcFF.proto / FreeFire.proto / GenSpin.py)
// ============================================================================

message MajorLoginGameSecurity {
  bytes raw_1 = 1;
  uint32 f2 = 2;
  uint32 f4 = 4;
  string version = 5;
  bytes raw_6 = 6;
}

