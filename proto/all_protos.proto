  uint32 draw_count = 2;
  uint32 event_id = 3;
  uint32 currency_type = 4;
  uint32 f7 = 7;
  uint32 f8 = 8;
  uint32 f9 = 9;
  uint32 f10 = 10;
  uint32 f11 = 11;
  uint32 f13 = 13;
}

