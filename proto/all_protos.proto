  string event_time = 3;
  string game_name = 4;
  int32 platform_id = 5;
  string client_version = 7;
  string system_software = 8;
  string system_hardware = 9;
  string telecom_operator = 10;
  string network_type = 11;
  uint32 screen_width = 12;
  uint32 screen_height = 13;
  string screen_dpi = 14;
  string processor_details = 15;
  uint32 memory = 16;
  string gpu_renderer = 17;
  string gpu_version = 18;
  string unique_device_id = 19;
  string client_ip = 20;
  string language = 21;
  string open_id = 22;
  string open_id_type = 23;
  string device_type = 24;
  string device_model = 25;
  string country_code = 26;
  string access_token = 29;
  int32 platform_sdk_id = 30;
  bytes game_security_data = 33;
  string network_operator_a = 41;
  string network_type_a = 42;
  string client_using_version = 57;
  int32 external_storage_total = 60;
  int32 external_storage_available = 61;
  int32 internal_storage_total = 62;
  int32 internal_storage_available = 63;
  int32 game_disk_storage_available = 64;
  int32 game_disk_storage_total = 65;
  int32 external_sdcard_avail_storage = 66;
  int32 external_sdcard_total_storage = 67;
  int32 field_70 = 70;
  int32 login_by = 73;
  string library_path = 74;
  int32 reg_avatar = 76;
  string library_token = 77;
  int32 channel_type = 78;
  int32 cpu_type = 79;
  string cpu_architecture = 81;
  string client_version_code = 83;
  int32 field_85 = 85;
  string graphics_api = 86;
  uint32 supported_astc_bitset = 87;
  int32 login_open_id_type = 88;
  bytes analytics_detail = 89;
  string field_90 = 90;
  string field_91 = 91;
  uint32 loading_time = 92;
  string release_channel = 93;
  string extra_info = 94;
  uint32 android_engine_init_flag = 95;
  string field_96 = 96;
  int32 if_push = 97;
  int32 is_vpn = 98;
  string origin_platform_type = 99;
  string primary_platform_type = 100;
  MajorLoginGameSecurity game_security_info = 102;
  uint32 field_104 = 104;
  int32 field_105 = 105;
  string field_106 = 106;
  string field_107 = 107;
}

message BlacklistInfoRes {
  int32 ban_reason = 1;
  int32 expire_duration = 2;
  int64 ban_time = 3;
}

message MajorLoginRes {
  uint64 account_id = 1;
  string lock_region = 2;
  string noti_region = 3;
  string ip_region = 4;
  string token = 8;
  uint32 ttl = 9;
  string server_url = 10;
  int32 emulator_score = 11;
  BlacklistInfoRes blacklist = 12;
  string ip_city = 16;
  string ip_subdivision = 17;
  uint32 kts = 21;
  bytes aes_ak = 22;
  bytes aes_aiv = 23;
}

// ============================================================================
// 2. MajorRegister & ChooseNewbieChoice (GenXDivan.py)
// ============================================================================

message MajorRegisterReq {
  string nickname = 1;
  string access_token = 2;
  string open_id = 3;
  uint32 platform_id = 4;
  uint32 flag_5 = 5;
  uint32 flag_6 = 6;
  string device_model = 7;
  string system_software = 8;
  string telecom_operator = 10;
  uint32 flag_12 = 12;
  string lang = 13;
  bytes xored_open_id = 14;
  string region = 15;
  uint32 flag_16 = 16;
  string client_version = 17;
}

message ChooseNewbieChoiceReq {
  uint32 choice_id = 1;
  uint32 step = 2;
}

// ============================================================================
// 3. GetLoginData (thunderFF.proto / RbcFF.proto)
// ============================================================================

message GetLoginDataRes {
  uint64 account_id = 1;
  string region = 3;
  string nickname = 4;
  uint32 level = 6;
  uint32 exp = 7;
  int32 clan_id = 12;
  string functional_addrs = 14;
  int32 likes = 21;
  string informational_addrs = 32;
  bytes servers = 44;
  string clan_name = 58;
  string grtc = 62;
}

// ============================================================================
// 4. Matchmaking & UDP Session Setup (thunderFF.proto / StartMatch.proto)
// ============================================================================

message StartMatch {
  uint32 mode = 1;
  uint32 region_id = 2;
  uint32 sub_mode = 3;
  uint32 map_id = 4;
  uint32 team_size = 5;
  string client_version = 7;
  uint32 flag_9 = 9;
  uint32 extra_flag = 13;
}

message StartUDPMatch {
  uint64 account_id = 1;
  string nickname = 2;
  string match_token = 3;
  uint32 sub_mode = 4;
  string device_model = 5;
  string gpu_renderer = 6;
  uint32 memory = 7;
  uint32 extra_flag = 9;
  string ip_address = 12;
  string client_version = 20;
}

message MatchFoundServerInfo {
  uint64 block_val = 1;
  string server_ip_port = 2;
  bytes udp_key = 3;
  string match_token = 4;
  string match_code = 42;
}

message MatchFoundPacket {
  uint64 account_id = 1;
  MatchFoundServerInfo server_info = 5;
  string match_code = 42;
}

// ============================================================================
// 5. Profile, Likes & UID Generator (AccountPersonalShow.proto / like.proto)
// ============================================================================

message GetPlayerPersonalShowReq {
  int64 uid = 1;
  int32 need_gallery_info = 2;
}

message LikeProfileReq {
  int64 uid = 1;
  string region = 2;
}

message UidGeneratorReq {
  int64 saturn_ = 1;
